# Alembic config — usa DATABASE_URL_SYNC del env (psycopg2 sync) en env.py.
# No hardcodeamos URL acá para que el container pueda apuntar a postgres directo
# (Alembic no soporta transaction pooling de PgBouncer).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC

# Formato del nombre de archivo de revisión: timestamp + slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Esto se reemplaza dinámicamente desde env.py leyendo DATABASE_URL_SYNC
sqlalchemy.url = postgresql://placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
