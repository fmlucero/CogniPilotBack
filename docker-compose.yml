# CogniPilot — stack completo (back + workers + front + infra)
# Levantar desde F:\Proys\cognipilot-back\ con: docker compose up -d --build
#
# Topología:
#   - postgres   ← DB principal (16-alpine)
#   - pgbouncer  ← pool de conexiones (transaction pooling) entre back y postgres
#   - redis      ← caché + backend de arq
#   - back-api   ← FastAPI (uvicorn), N réplicas — endpoint scaling
#   - back-worker ← arq workers, M réplicas — FCM push, batch inserts
#   - front      ← Next.js admin UI (build separado)
#   - nginx      ← reverse proxy: /api/* → back-api, resto → front
#   - pgadmin    ← UI Postgres (opcional, solo dev)

services:
  postgres:
    image: postgres:16-alpine
    container_name: cognipilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cognipilot-net

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    container_name: cognipilot-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cognipilot-net

  redis:
    image: redis:7-alpine
    container_name: cognipilot-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cognipilot-net

  back-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cognipilot-back:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Para FastAPI usa pgbouncer (transaction pooling)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      # Para Alembic (que necesita sesiones, no pool transaction) usa postgres directo
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # No exponemos puerto: tráfico entra solo por nginx
    networks:
      - cognipilot-net
    deploy:
      replicas: 2  # Escalable: 'docker compose up -d --scale back-api=4'

  back-worker:
    image: cognipilot-back:latest
    restart: unless-stopped
    depends_on:
      back-api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Override del CMD del Dockerfile: corre el worker arq en vez de la API
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    networks:
      - cognipilot-net
    deploy:
      replicas: 1

  front:
    # Cuando movamos el front a este compose: build context apuntando al repo del front
    # Por ahora deshabilitado — el front sigue corriendo en su compose viejo.
    # Descomentar al hacer cutover:
    # build:
    #   context: ../cognipilot-remote
    # image: cognipilot-front:latest
    image: nginx:1.27-alpine  # placeholder para que el compose valide
    container_name: cognipilot-front-placeholder
    profiles: ["disabled"]  # No arranca hasta sacar este profile

  nginx:
    image: nginx:1.27-alpine
    container_name: cognipilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - back-api
    networks:
      - cognipilot-net
    profiles: ["with-nginx"]  # Activar con: docker compose --profile with-nginx up
    # Healthcheck simple
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────
  # Observabilidad — perfil "monitoring"
  # Levantar con: docker compose --profile monitoring up -d
  # ─────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: cognipilot-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cognipilot-net
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cognipilot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"  # Grafana en :3001 para no chocar con el front Next.js
    depends_on:
      - prometheus
    networks:
      - cognipilot-net
    profiles: ["monitoring"]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cognipilot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cognipilot.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cognipilot-net
    profiles: ["dev"]  # Solo dev: docker compose --profile dev up

networks:
  cognipilot-net:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
  redisdata:
  prometheus_data:
  grafana_data:
