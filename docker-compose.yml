# CogniPilot — stack completo (back + workers + front + infra)
#
# Dos modos de operación:
#
#  A) MODO PARALELO (validar contra el back viejo, mismo postgres)
#     postgres y pgbouncer NO arrancan (están en profile bundled-db).
#     back-api conecta al postgres del back viejo via host.docker.internal:5432.
#     Levantar:  docker compose up -d redis back-api back-worker
#
#  B) MODO BUNDLED (post-cutover, todo en este compose)
#     postgres + pgbouncer en este compose, todo cohesionado.
#     Levantar:  docker compose --profile bundled-db up -d
#                docker compose --profile bundled-db --profile with-nginx --profile with-front up -d
#
# Topología:
#   - postgres   ← DB principal (profile bundled-db)
#   - pgbouncer  ← pool de conexiones (profile bundled-db)
#   - redis      ← caché + backend de arq (siempre)
#   - back-api   ← FastAPI (uvicorn), N réplicas — endpoint scaling
#   - back-worker ← arq workers, M réplicas — FCM push, batch inserts
#   - front      ← Next.js admin UI (profile with-front, post-cutover)
#   - nginx      ← reverse proxy (profile with-nginx)
#   - pgadmin    ← UI Postgres (profile dev)
#   - prometheus + grafana ← observabilidad (profile monitoring)

services:
  postgres:
    image: postgres:16-alpine
    container_name: cognipilot-postgres-back
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cognipilot-net
    profiles: ["bundled-db"]  # Solo en modo bundled. En paralelo usamos el postgres del back viejo.

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    container_name: cognipilot-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cognipilot-net
    profiles: ["bundled-db"]

  redis:
    image: redis:7-alpine
    container_name: cognipilot-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cognipilot-net

  back-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cognipilot-back:latest
    container_name: cognipilot-back-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # URLs configurables desde .env. Default usa host.docker.internal (modo paralelo).
      # Para modo bundled, override en .env: DATABASE_URL=postgresql+asyncpg://...@pgbouncer:5432/...
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Para conectar al postgres que corre en el HOST (modo paralelo)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Puerto externo para validación previa al cutover (cuando nginx esté delante, se puede quitar)
    ports:
      - "${BACK_API_PORT:-8001}:8000"
    networks:
      - cognipilot-net

  back-worker:
    image: cognipilot-back:latest
    container_name: cognipilot-back-worker
    restart: unless-stopped
    depends_on:
      back-api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override del CMD del Dockerfile: corre el worker arq en vez de la API
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    networks:
      - cognipilot-net

  front:
    # Activar al hacer cutover post-validación
    image: nginx:1.27-alpine  # placeholder
    container_name: cognipilot-front-placeholder
    profiles: ["with-front"]

  nginx:
    image: nginx:1.27-alpine
    container_name: cognipilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - back-api
    networks:
      - cognipilot-net
    profiles: ["with-nginx"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────
  # Observabilidad — perfil "monitoring"
  # Levantar con: docker compose --profile monitoring up -d
  # ─────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: cognipilot-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cognipilot-net
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cognipilot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"  # Grafana en :3001 para no chocar con el front Next.js
    depends_on:
      - prometheus
    networks:
      - cognipilot-net
    profiles: ["monitoring"]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cognipilot-pgadmin-back
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cognipilot.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5051:80"  # 5051 para no chocar con el pgadmin del back viejo
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cognipilot-net
    profiles: ["dev"]

networks:
  cognipilot-net:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
  redisdata:
  prometheus_data:
  grafana_data:
