global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: cognipilot

scrape_configs:
  - job_name: cognipilot-back
    metrics_path: /metrics
    static_configs:
      - targets: ["back-api:8000"]
        labels:
          component: api

  # Si más adelante hay réplicas adicionales o el worker expone sus propias métricas,
  # se agregan acá.

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
