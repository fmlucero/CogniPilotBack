# nginx — reverse proxy CogniPilot
#
# Topología:
#   - /api/*, /metrics (interno), /docs, /redoc → back-api (FastAPI)
#   - /admin/*, /login, /                       → front (Next.js)
#
# Notas de seguridad:
#   - /metrics NO se expone externamente (solo accesible desde la red Docker
#     interna donde corre Prometheus). Bloqueado a nivel nginx por defecto.
#   - Las cookies httpOnly cp_at / cp_rt fluyen transparentes entre back y front.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    client_max_body_size 10M;

    # Compresión
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 256;

    # Resolver dinámico (Docker DNS interno) — para que nginx re-resuelva DNS
    # de servicios en la network cognipilot-net cuando se recrean y cambian IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # back-api: usamos `set` + variable en proxy_pass para forzar lookup DNS
    #           por request (Docker DNS conoce back-api porque es un service
    #           en la misma compose network).
    #
    # front:    usamos `upstream` estático porque host.docker.internal vive
    #           solo en /etc/hosts (vía extra_hosts: host-gateway), NO en el
    #           Docker DNS. El resolver no lo encuentra, pero el lookup al
    #           startup via /etc/hosts sí. La IP del host gateway es estable.
    upstream cognipilot_front {
        server host.docker.internal:3000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # /metrics solo expuesto internamente. nginx lo bloquea desde afuera.
        location = /metrics {
            return 404;
        }

        # API → FastAPI
        location /api/ {
            set $back_api "back-api:8000";
            proxy_pass http://$back_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Cookies httpOnly: que pasen transparentes
            proxy_pass_header Set-Cookie;

            # Buffer chico para que los eventos /events/bulk no se acumulen
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;

            # Timeouts razonables (los hot endpoints son <100ms)
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # SSE (Server-Sent Events) — HU-18 fase 4
        # Buffer OFF (sino los eventos se acumulan y no llegan al cliente).
        # Timeouts largos (la conexión es de larga duración, ping cada 15s la mantiene viva).
        location /api/realtime/ {
            set $back_api "back-api:8000";
            proxy_pass http://$back_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_pass_header Set-Cookie;

            proxy_buffering off;       # crítico para SSE
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;

            proxy_connect_timeout 5s;
            proxy_send_timeout 24h;    # streams largos
            proxy_read_timeout 24h;
        }

        # OpenAPI (solo en dev — la prop is_dev del settings ya oculta /docs en prod)
        location ~ ^/(docs|redoc|openapi.json) {
            set $back_api "back-api:8000";
            proxy_pass http://$back_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Healthcheck pasa al API
        location ~ ^/health {
            set $back_api "back-api:8000";
            proxy_pass http://$back_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Todo lo demás → Next.js (UI admin + login + Server Components)
        location / {
            proxy_pass http://cognipilot_front;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
