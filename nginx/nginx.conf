# nginx — reverse proxy CogniPilot
#
# Topología:
#   - /api/*, /metrics (interno), /docs, /redoc → back-api (FastAPI)
#   - /admin/*, /login, /                       → front (Next.js)
#
# Notas de seguridad:
#   - /metrics NO se expone externamente (solo accesible desde la red Docker
#     interna donde corre Prometheus). Bloqueado a nivel nginx por defecto.
#   - Las cookies httpOnly cp_at / cp_rt fluyen transparentes entre back y front.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    client_max_body_size 10M;

    # Compresión
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 256;

    # Upstreams — docker-compose resuelve los nombres del service.
    # Para múltiples réplicas, Docker DNS hace round-robin automáticamente.
    upstream cognipilot_api {
        server back-api:8000;
        keepalive 16;
    }

    upstream cognipilot_front {
        server front:3000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # /metrics solo expuesto internamente. nginx lo bloquea desde afuera.
        location = /metrics {
            return 404;
        }

        # API → FastAPI
        location /api/ {
            proxy_pass http://cognipilot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Cookies httpOnly: que pasen transparentes
            proxy_pass_header Set-Cookie;

            # Buffer chico para que los eventos /events/bulk no se acumulen
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;

            # Timeouts razonables (los hot endpoints son <100ms; este margen cubre FCM async)
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # OpenAPI (solo en dev — la prop is_dev del settings ya oculta /docs en prod)
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://cognipilot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Healthcheck pasa al API
        location ~ ^/health {
            proxy_pass http://cognipilot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Todo lo demás → Next.js (UI admin + login + Server Components)
        location / {
            proxy_pass http://cognipilot_front;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
